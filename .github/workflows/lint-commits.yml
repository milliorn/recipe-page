name: Lint Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Check Commits Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetches all history so all commits in the PR can be checked

      # security is added to the action's own default list (not replaced)
      # since release-please-config.json's changelog-sections relies on it
      # as a real, usable commit type, confirmed in use by #596's merge
      # commit title (though that slipped past this check at squash-merge
      # time rather than being validated, since this workflow checks PR
      # commits, not the final merge title).
      - name: Lint Commits
        uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          allowed-commit-types: 'feat,fix,docs,style,refactor,test,build,perf,ci,chore,revert,merge,wip,security'

      # This repo squash-merges PRs with the PR title as the squash commit
      # subject (settings: allow_merge_commit=false, squash_merge_commit_title=PR_TITLE),
      # and that title is freely editable at merge time, separate from any
      # commit message already checked above. release-please parses that
      # resulting commit on main, so an invalid title here would silently
      # skip the change or omit it from release notes even though every
      # commit on the branch passed.
      - name: Lint PR Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          ALLOWED_TYPES: 'feat|fix|docs|style|refactor|test|build|perf|ci|chore|revert|merge|wip|security'
        run: |
          if ! echo "$PR_TITLE" | grep -qE "^($ALLOWED_TYPES)(\([^)]+\))?!?: .+"; then
            echo "::error::PR title '$PR_TITLE' does not follow Conventional Commits syntax. This title becomes the squash merge commit that release-please parses on main."
            exit 1
          fi

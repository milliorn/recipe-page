name: Dependabot reviewer

# Fires whenever Dependabot opens, updates, or reopens a PR targeting main.
# pull_request_target runs in the context of the base branch, which gives the
# GITHUB_TOKEN enough permission to approve and close PRs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ['main']

# One run per PR at a time. We let the current run finish so an in-progress
# squash merge isn't interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Minimum permissions needed by GITHUB_TOKEN:
# - pull-requests: approve, comment on and close PRs
# - contents: read (the merge uses RELEASE_PLEASE_TOKEN)
permissions:
  pull-requests: write
  contents: read

env:
  # Opt into Node.js 24 now ahead of the June 2, 2026 forced migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip entirely if this PR wasn't opened by Dependabot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Decide once: allow github_actions (any semver) or npm patch/minor updates;
      # deny everything else (e.g. npm major, which dependabot.yml also blocks upstream).
      - name: Decide
        id: decision
        # Every step reads metadata via env, not inline ${{ }}, so it is never run as shell code.
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          if [[ "$ECOSYSTEM" == "github_actions" ]] || \
             [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]] || \
             [[ "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            echo "action=allow" >> "$GITHUB_OUTPUT"
          else
            echo "action=deny" >> "$GITHUB_OUTPUT"
          fi

      # --auto waits for required checks (e.g. merge-gatekeeper) before merging.
      # It runs as RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN: pushes made with
      # GITHUB_TOKEN never start workflows, so release-please.yml would not run.
      # Approve first so auto-merge is never left enabled on an unapproved PR.
      - name: Allow — approve and merge
        if: steps.decision.outputs.action == 'allow'
        env:
          MERGE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is empty; refusing to merge with GITHUB_TOKEN (release-please.yml would not run)."
            exit 1
          fi
          gh pr review "$PR_URL" --approve -b "Auto-approved: **${UPDATE_TYPE}** ${ECOSYSTEM} update."
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR_URL" --squash --auto

      - name: Deny — unexpected update
        if: steps.decision.outputs.action == 'deny'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          gh pr close "$PR_URL" --comment "Auto-closed: ecosystem \`${ECOSYSTEM}\` / update-type \`${UPDATE_TYPE}\` did not match any allow-list rule. Check dependabot.yml if this is unexpected."

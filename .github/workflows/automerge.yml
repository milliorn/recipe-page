name: Dependabot reviewer

# Fires whenever Dependabot opens, updates, or reopens a PR targeting main.
# pull_request_target runs in the context of the base branch, which gives the
# GITHUB_TOKEN enough permission to approve and merge without extra secrets.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ['main']

# One run per PR at a time. We let the current run finish so an in-progress
# squash merge isn't interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Minimum permissions needed:
# - pull-requests: approve and comment on PRs
# - contents: enable auto-merge (writes to the merge queue)
permissions:
  pull-requests: write
  contents: write

env:
  # Opt into Node.js 24 now ahead of the June 2, 2026 forced migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip entirely if this PR wasn't opened by Dependabot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Decide once: allow github_actions (any semver) or npm patch/minor updates;
      # deny everything else (e.g. npm major, which dependabot.yml also blocks upstream).
      - name: Decide
        id: decision
        run: |
          ecosystem="${{ steps.metadata.outputs.package-ecosystem }}"
          update_type="${{ steps.metadata.outputs.update-type }}"
          if [[ "$ecosystem" == "github_actions" ]] || \
             [[ "$update_type" == "version-update:semver-patch" ]] || \
             [[ "$update_type" == "version-update:semver-minor" ]]; then
            echo "action=allow" >> "$GITHUB_OUTPUT"
          else
            echo "action=deny" >> "$GITHUB_OUTPUT"
          fi

      # --auto queues the merge so all required branch protection checks must
      # pass first (e.g. dependency-review) before the merge goes through.
      # The merge uses RELEASE_PLEASE_TOKEN (a PAT owned by milliorn), not
      # GITHUB_TOKEN: GitHub never starts workflows from a push made with
      # GITHUB_TOKEN, so release-please.yml would otherwise never run after a
      # Dependabot merge. milliorn is also an allowed actor in the repo's
      # Actions policy, so the resulting push event is permitted.
      - name: Allow — approve and merge
        if: steps.decision.outputs.action == 'allow'
        env:
          MERGE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          # gh silently falls back to GITHUB_TOKEN when GH_TOKEN is empty,
          # which would bring back the "no release-please run" problem.
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is empty; refusing to merge with GITHUB_TOKEN, since that push would not trigger release-please.yml."
            exit 1
          fi
          gh pr review "$PR_URL" --approve -b "Auto-approved: **${{ steps.metadata.outputs.update-type }}** ${{ steps.metadata.outputs.package-ecosystem }} update."
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR_URL" --squash --auto

      - name: Deny — unexpected update
        if: steps.decision.outputs.action == 'deny'
        run: |
          gh pr close "$PR_URL" --comment "Auto-closed: ecosystem \`${{ steps.metadata.outputs.package-ecosystem }}\` / update-type \`${{ steps.metadata.outputs.update-type }}\` did not match any allow-list rule. Check dependabot.yml if this is unexpected."

# Verifies the site still installs and builds on every PR, including
# Dependabot's. automerge.yml only inspects Dependabot's update metadata
# (patch/minor/major) -- it never installs or builds anything, so a patch
# release that breaks the Gatsby build would otherwise merge unchecked. Add
# this workflow's job as a required status check (alongside merge-gatekeeper)
# so that no longer happens.
name: CI

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # package.json's "lint" script runs `prettier --write`, which mutates
      # files instead of failing -- not useful as a CI gate, so check instead.
      - name: Check formatting
        run: npx prettier --check .

      - name: Build
        run: npm run build

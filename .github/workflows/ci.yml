# Verifies the site still installs and builds on every PR, including
# Dependabot's. automerge.yml only inspects Dependabot's update metadata
# (patch/minor/major) -- it never installs or builds anything, so a patch
# release that breaks the Gatsby build would otherwise merge unchecked.
# Merge Gatekeeper (the only check listed under required_status_checks on
# the main branch ruleset) has no checks/ignored input configured, so it
# already waits on and aggregates this job before it can pass -- CI does
# not need to be separately marked required.
name: CI

on:
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # package.json's "lint" script runs `prettier --write`, which mutates
      # files instead of failing -- not useful as a CI gate, so check instead.
      - name: Check formatting
        run: npx prettier --check .

      - name: Check for unused dependencies
        run: npm run depcheck

      - name: Run tests
        run: npm test

      # Gatsby build fetches content from Contentful at build time via
      # gatsby-source-contentful, so it needs these credentials. Netlify's
      # deploys already have them configured separately in Netlify's own
      # dashboard; GitHub Actions needs its own copy as repo secrets.
      - name: Build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_API_KEY: ${{ secrets.CONTENTFUL_API_KEY }}
        run: npm run build
